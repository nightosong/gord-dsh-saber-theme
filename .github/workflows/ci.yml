name: Test and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - run: node scripts/release.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: saber-${{ matrix.platform }}
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.platform }}
          path: test-results/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: saber-*
          path: release
          merge-multiple: true
      - name: Publish platform archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
